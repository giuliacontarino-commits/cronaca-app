<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronaca</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--surface:#fff;--ink:#1a1a1a;--ink-soft:#4a4a4a;--ink-faded:#8a8a8a;--line:#e8e3db;--accent:#8b0000;--tag-italia-bg:#f0ebe1;--tag-italia-ink:#5a4a2a;--tag-estero-bg:#e8e1d8;--tag-estero-ink:#3a3a3a;--tag-garlasco-bg:#8b0000;--tag-garlasco-ink:#faf8f5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.container{max-width:760px;margin:0 auto;padding:24px 20px 80px}
header{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:24px}
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(32px,7vw,48px);letter-spacing:-.02em;line-height:1}
.date{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);font-weight:500;white-space:nowrap}
.tagline{margin-top:8px;font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--ink-soft)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.filters{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.filter-btn{background:transparent;border:none;padding:7px 16px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-soft);border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.filter-btn.active{background:var(--ink);color:var(--bg)}
.filter-btn[data-filter="garlasco"].active{background:var(--accent);color:var(--bg)}
.filter-count{font-size:11px;background:rgba(0,0,0,.08);padding:1px 7px;border-radius:999px;font-weight:600}
.filter-btn.active .filter-count{background:rgba(255,255,255,.2)}
.refresh-btn{background:transparent;border:1px solid var(--line);padding:8px 14px;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-soft);border-radius:999px;cursor:pointer}
.status{font-size:12px;color:var(--ink-faded);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.special-banner{background:linear-gradient(135deg,var(--accent) 0%,#5a0000 100%);color:var(--bg);padding:20px;border-radius:6px;margin-bottom:24px}
.special-banner-label{font-size:11px;text-transform:uppercase;letter-spacing:.15em;opacity:.85;margin-bottom:6px;font-weight:600}
.special-banner-title{font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin-bottom:6px}
.special-banner-desc{font-family:'Fraunces',serif;font-style:italic;font-size:14px;opacity:.9;line-height:1.5}
.news-item{padding:22px 0;border-bottom:1px solid var(--line);display:block;color:inherit;text-decoration:none;margin:0 -20px;padding-left:20px;padding-right:20px}
.news-item:hover{background:rgba(0,0,0,.02)}
.news-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:3px}
.tag-italia{background:var(--tag-italia-bg);color:var(--tag-italia-ink)}
.tag-estero{background:var(--tag-estero-bg);color:var(--tag-estero-ink)}
.tag-garlasco{background:var(--tag-garlasco-bg);color:var(--tag-garlasco-ink)}
.source{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.time{font-size:12px;color:var(--ink-faded)}
.news-title{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(18px,4vw,22px);line-height:1.25;color:var(--ink);margin-bottom:6px}
.news-summary{font-size:14px;line-height:1.55;color:var(--ink-soft)}
.empty,.error{text-align:center;padding:60px 20px;color:var(--ink-faded)}
.error{color:var(--accent)}
footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--ink-faded);line-height:1.6}
</style>
</head>
<body>
<div class="container">
<header>
<div class="masthead">
<h1>Cronaca</h1>
<div class="date" id="today-date"></div>
</div>
<p class="tagline">Notizie di cronaca dall'Italia e dal mondo</p>
</header>
<div class="controls">
<div class="filters">
<button class="filter-btn active" data-filter="all">Tutte</button>
<button class="filter-btn" data-filter="italia">Italia</button>
<button class="filter-btn" data-filter="estero">Estero</button>
<button class="filter-btn" data-filter="garlasco">Speciale Garlasco <span class="filter-count" id="garlasco-count">0</span></button>
</div>
<button class="refresh-btn" id="refresh-btn">Aggiorna</button>
</div>
<div class="status" id="status">Caricamento in corso...</div>
<div id="news-list"></div>
<footer>Le notizie sono raccolte dai feed pubblici delle testate originali.<br>Clicca su una notizia per leggere l'articolo completo sul sito della testata.</footer>
</div>
<script>
let allNews=[];let currentFilter='all';
function formatDate(){const d=new Date();return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function timeAgo(s){const d=new Date(s);const sec=Math.floor((Date.now()-d)/1000);if(sec<60)return'pochi secondi fa';const m=Math.floor(sec/60);if(m<60)return m+' min fa';const h=Math.floor(m/60);if(h<24)return h+' h fa';const days=Math.floor(h/24);if(days<7)return days+' g fa';return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}
function esc(s){if(!s)return'';return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tagLabel(area){if(area==='italia')return'Italia';if(area==='estero')return'Estero';if(area==='garlasco')return'Garlasco';return area}
function render(){
  const list=document.getElementById('news-list');
  const status=document.getElementById('status');
  let f;
  if(currentFilter==='all'){f=allNews.filter(n=>n.area!=='garlasco')}
  else if(currentFilter==='garlasco'){f=allNews.filter(n=>n.area==='garlasco')}
  else{f=allNews.filter(n=>n.area===currentFilter)}
  // Banner speciale visibile solo nella sezione Garlasco
  const banner=currentFilter==='garlasco'?'<div class="special-banner"><div class="special-banner-label">Speciale</div><div class="special-banner-title">Il caso Garlasco</div><div class="special-banner-desc">Tutti gli aggiornamenti dalle principali testate sull\'inchiesta e gli sviluppi giudiziari.</div></div>':'';
  if(f.length===0){list.innerHTML=banner+'<div class="empty">Nessuna notizia trovata.</div>';status.textContent='0 notizie';return}
  status.textContent=f.length+' notizie';
  list.innerHTML=banner+f.map(n=>'<a href="'+esc(n.link)+'" target="_blank" rel="noopener" class="news-item"><div class="news-meta"><span class="tag tag-'+n.area+'">'+tagLabel(n.area)+'</span><span class="source">'+esc(n.source)+'</span><span class="time">'+timeAgo(n.pubDate)+'</span></div><h2 class="news-title">'+esc(n.title)+'</h2>'+(n.summary?'<p class="news-summary">'+esc(n.summary)+'</p>':'')+'</a>').join('')
}
function updateGarlascoCount(){
  const n=allNews.filter(x=>x.area==='garlasco').length;
  const el=document.getElementById('garlasco-count');
  el.textContent=n;
  el.style.display=n>0?'inline-block':'none';
}
async function loadNews(){try{const r=await fetch('/api/news');if(!r.ok)throw new Error('Errore server');const d=await r.json();allNews=d.news||[];updateGarlascoCount();render()}catch(e){document.getElementById('news-list').innerHTML='<div class="error">Impossibile caricare le notizie. Riprova fra qualche istante.</div>';document.getElementById('status').textContent='Errore'}}
document.getElementById('today-date').textContent=formatDate();
document.querySelectorAll('.filter-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()})});
document.getElementById('refresh-btn').addEventListener('click',loadNews);
loadNews();
setInterval(loadNews,5*60*1000);
</script>
</body>
</html>
